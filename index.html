<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Study Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Sans+Condensed:wght@600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --bg: #12151b;
    --paper: #f4f1e7;
    --paper-line: rgba(20,20,20,0.07);
    --ink: #1c1f26;
    --muted: #8a8577;
    --muted-2: #5b5646;
    --green: #3f8f5f;
    --green-bg: #e4efe5;
    --rust: #bd4f2e;
    --rust-bg: #f3e4dd;
    --gold: #b8862e;
    --radius: 3px;
  }
  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', sans-serif;
    min-height: 100vh;
  }
  .app{ max-width: 760px; margin: 0 auto; padding: 28px 20px 80px; }
  .topbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom: 22px; }
  .icon-btn{
    width: 42px; height: 42px; border-radius: 50%;
    border: 1px solid rgba(244,241,231,0.18);
    background: transparent; color: #f4f1e7; font-size: 20px;
    display:flex; align-items:center; justify-content:center; cursor:pointer;
    transition: background 0.15s, transform 0.1s;
  }
  .icon-btn:hover{ background: rgba(244,241,231,0.08); }
  .icon-btn:active{ transform: scale(0.94); }
  .brand{ font-family: 'IBM Plex Mono', monospace; color: rgba(244,241,231,0.55); font-size: 12.5px; letter-spacing: 0.02em; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .brand b{ color:#f4f1e7; font-weight:600; }
  .switch-link{ color: rgba(244,241,231,0.4); cursor:pointer; font-size: 11px; text-decoration:underline; }
  .switch-link:hover{ color: rgba(244,241,231,0.75); }

  .sheet{
    background: var(--paper); border-radius: 6px; box-shadow: 0 20px 50px rgba(0,0,0,0.45);
    background-image: linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 34px; padding: 34px 32px 30px; position: relative; overflow: hidden;
  }
  .sheet::before{ content:''; position:absolute; left:56px; top:0; bottom:0; width:1px; background: rgba(189,79,46,0.18); }
  .sheet-inner{ padding-left: 26px; }
  .hero-row{ display:flex; align-items: baseline; gap: 18px; margin-bottom: 4px; }
  .hero-num{ font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 64px; line-height: 1; color: var(--ink); }
  .hero-label{ font-size: 15px; color: var(--muted-2); padding-bottom: 6px; }
  .hero-sub{ font-size: 13px; color: var(--muted); margin-top: 2px; font-family: 'IBM Plex Mono', monospace; }
  .divider{ border: none; border-top: 1px dashed rgba(20,20,20,0.18); margin: 24px 0 20px; }
  .section-label{ font-size: 13px; color: var(--muted-2); margin-bottom: 14px; display:flex; align-items:center; justify-content: space-between; }
  .section-label .date{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted); }
  .status-grid{ display:flex; flex-direction: column; gap: 8px; }
  .status-row{ display:flex; align-items:center; gap: 12px; padding: 10px 12px; background: rgba(255,255,255,0.35); border-radius: var(--radius); cursor: pointer; transition: background 0.15s; border: 1px solid transparent; }
  .status-row:hover{ background: rgba(255,255,255,0.6); border-color: rgba(20,20,20,0.08); }
  .dot{ width: 9px; height: 9px; border-radius: 50%; flex-shrink: 0; }
  .dot.done{ background: var(--green); box-shadow: 0 0 0 3px var(--green-bg); }
  .dot.pending{ background: var(--rust); box-shadow: 0 0 0 3px var(--rust-bg); }
  .status-name{ flex:1; font-size: 14.5px; font-weight: 500; }
  .status-tag{ font-family: 'IBM Plex Mono', monospace; font-size: 11px; padding: 3px 8px; border-radius: 20px; letter-spacing: 0.02em; }
  .status-tag.done{ color: var(--green); background: var(--green-bg); }
  .status-tag.pending{ color: var(--rust); background: var(--rust-bg); }
  .empty{ text-align:center; padding: 34px 10px; color: var(--muted); }
  .empty .big{ font-family:'IBM Plex Sans Condensed', sans-serif; font-size: 20px; color: var(--ink); margin-bottom: 6px; font-weight: 600; }
  .empty button{ margin-top: 14px; }
  .btn{ font-family: 'IBM Plex Sans', sans-serif; font-size: 13.5px; font-weight: 500; border: none; border-radius: var(--radius); padding: 10px 18px; cursor: pointer; transition: filter 0.15s, transform 0.1s; }
  .btn:active{ transform: scale(0.98); }
  .btn-primary{ background: var(--ink); color: var(--paper); }
  .btn-primary:hover{ filter: brightness(1.3); }
  .btn-ghost{ background: transparent; color: var(--muted-2); border: 1px solid rgba(20,20,20,0.2); }
  .btn-ghost:hover{ background: rgba(20,20,20,0.05); }
  .overlay{ position: fixed; inset:0; background: rgba(10,11,14,0.6); display:flex; align-items:flex-start; justify-content:center; padding: 40px 16px; overflow-y: auto; z-index: 50; backdrop-filter: blur(2px); }
  .panel{ background: var(--paper); border-radius: 6px; max-width: 480px; width: 100%; padding: 26px 26px 24px; box-shadow: 0 25px 60px rgba(0,0,0,0.5); }
  .panel-head{ display:flex; align-items:center; justify-content: space-between; margin-bottom: 18px; }
  .panel-title{ font-family: 'IBM Plex Sans Condensed', sans-serif; font-weight: 700; font-size: 21px; }
  .panel-close{ background:none; border:none; cursor:pointer; font-size: 20px; color: var(--muted); line-height:1; }
  label{ display:block; font-size: 12px; color: var(--muted-2); margin: 14px 0 6px; font-family:'IBM Plex Mono', monospace; }
  label:first-of-type{ margin-top:0; }
  input[type="text"], textarea, select, input[type="date"], input[type="time"]{
    width: 100%; font-family: 'IBM Plex Sans', sans-serif; font-size: 14.5px; padding: 10px 12px;
    border-radius: var(--radius); border: 1px solid rgba(20,20,20,0.2); background: #fff; color: var(--ink);
  }
  textarea{ resize: vertical; min-height: 80px; font-family:'IBM Plex Sans',sans-serif; }
  .swatches{ display:flex; gap: 8px; margin-top: 2px; }
  .swatch{ width: 26px; height: 26px; border-radius: 50%; cursor: pointer; border: 2px solid transparent; }
  .swatch.selected{ border-color: var(--ink); }
  .panel-actions{ display:flex; justify-content:flex-end; gap: 10px; margin-top: 22px; }
  .course-grid{ display:flex; flex-direction:column; gap: 10px; }
  .course-card{ display:flex; align-items:center; gap: 14px; padding: 14px 14px; background: rgba(255,255,255,0.35); border-radius: var(--radius); cursor:pointer; border: 1px solid transparent; transition: background 0.15s; }
  .course-card:hover{ background: rgba(255,255,255,0.6); border-color: rgba(20,20,20,0.08); }
  .course-chip{ width: 34px; height:34px; border-radius: 50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Sans Condensed', sans-serif; font-weight:700; color:#fff; font-size:15px; }
  .course-meta{ flex:1; min-width:0; }
  .course-meta .name{ font-size:15px; font-weight:500; }
  .course-meta .stat{ font-size:12px; color:var(--muted); font-family:'IBM Plex Mono', monospace; margin-top:2px; }
  .chev{ color: var(--muted); font-size: 16px; }
  .back-row{ display:flex; align-items:center; gap:10px; margin-bottom: 18px; cursor:pointer; color: var(--muted-2); font-size: 13px; width: fit-content; }
  .back-row:hover{ color: var(--ink); }
  .detail-head{ display:flex; align-items:center; gap:14px; margin-bottom: 22px; }
  .detail-title{ font-family:'IBM Plex Sans Condensed', sans-serif; font-weight:700; font-size: 30px; }
  .streak-pill{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted-2); background: rgba(20,20,20,0.06); padding: 4px 10px; border-radius: 20px; }
  .timeline{ display:flex; flex-direction:column; gap: 22px; margin-top: 6px; }
  .tl-day{ display:flex; flex-direction:column; gap:8px; }
  .tl-date{ font-family:'IBM Plex Mono', monospace; font-size: 11.5px; color: var(--muted); letter-spacing: 0.03em; }
  .tl-entry{ display:flex; gap: 12px; padding: 12px 14px; background: rgba(255,255,255,0.4); border-radius: var(--radius); border-left: 2px solid var(--green); }
  .tl-time{ font-family:'IBM Plex Mono', monospace; font-size: 12px; color: var(--muted-2); flex-shrink:0; width: 56px; padding-top:1px; }
  .tl-text{ font-size: 14px; line-height:1.5; white-space:pre-wrap; flex:1; }
  .tl-del{ background:none; border:none; cursor:pointer; color: var(--muted); font-size: 14px; opacity:0; transition: opacity 0.15s; flex-shrink: 0; }
  .tl-entry:hover .tl-del{ opacity: 0.6; }
  .tl-del:hover{ opacity: 1 !important; color: var(--rust); }
  .toast{ position: fixed; bottom: 24px; left:50%; transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 20px; font-size: 13px; font-family:'IBM Plex Mono', monospace; box-shadow: 0 10px 30px rgba(0,0,0,0.4); z-index: 100; opacity:0; pointer-events:none; transition: opacity 0.25s, transform 0.25s; }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(-4px); }
  ::selection{ background: var(--gold); color:#fff; }

  .profile-screen{ display:flex; flex-direction:column; align-items:center; justify-content:center; min-height: 60vh; text-align:center; }
  .profile-heading{ font-family:'IBM Plex Sans Condensed', sans-serif; font-weight:700; font-size: 26px; color:#f4f1e7; margin-bottom: 6px; }
  .profile-sub{ color: rgba(244,241,231,0.5); font-size: 13px; margin-bottom: 34px; font-family:'IBM Plex Mono', monospace; }
  .profile-grid{ display:flex; flex-wrap:wrap; gap: 22px; justify-content:center; max-width: 560px; }
  .profile-tile{ display:flex; flex-direction:column; align-items:center; gap: 10px; cursor:pointer; width: 96px; }
  .profile-avatar{ width: 84px; height:84px; border-radius: 10px; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Sans Condensed', sans-serif; font-weight:700; font-size: 30px; color:#fff; border: 2px solid transparent; transition: border-color 0.15s, transform 0.15s; overflow: hidden; }
  .avatar-img{ width:100%; height:100%; border-radius:inherit; object-fit:cover; display:block; }
  .profile-tile:hover .profile-avatar{ border-color: rgba(244,241,231,0.6); transform: scale(1.04); }
  .profile-tile-name{ color: rgba(244,241,231,0.75); font-size: 13.5px; }
  .profile-add-tile .profile-avatar{ background: transparent; border: 2px dashed rgba(244,241,231,0.3); color: rgba(244,241,231,0.5); font-size: 30px; font-weight:400; }
  .profile-add-tile:hover .profile-avatar{ border-color: rgba(244,241,231,0.7); color:#f4f1e7; }
  .setup-note{ max-width: 480px; color: rgba(244,241,231,0.6); font-size: 13px; line-height:1.6; margin-top: 30px; font-family:'IBM Plex Mono', monospace; background: rgba(244,241,231,0.06); padding: 16px 18px; border-radius: 6px; text-align:left; }
  .setup-note b{ color:#f4f1e7; }

  .settings-section{ margin-bottom: 26px; }
  .settings-section:last-child{ margin-bottom:0; }
  .settings-section-title{ font-family:'IBM Plex Sans Condensed', sans-serif; font-weight:700; font-size:15px; color:var(--ink); margin-bottom:12px; }
  .settings-avatar-row{ display:flex; align-items:center; gap:16px; margin-bottom: 4px; }
  .settings-avatar{ width:64px; height:64px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Sans Condensed', sans-serif; font-weight:700; font-size:24px; color:#fff; cursor:pointer; overflow:hidden; flex-shrink:0; position:relative; }
  .settings-avatar::after{ content:'Change'; position:absolute; inset:0; background:rgba(0,0,0,0.5); color:#fff; font-size:10px; font-family:'IBM Plex Mono',monospace; display:flex; align-items:center; justify-content:center; opacity:0; transition:opacity 0.15s; }
  .settings-avatar:hover::after{ opacity:1; }
  .settings-name-row{ display:flex; gap:10px; margin-top:14px; }
  .settings-name-row input{ flex:1; }
  .resource-row{ display:flex; align-items:center; gap:12px; padding:10px 12px; background:rgba(255,255,255,0.35); border-radius:var(--radius); margin-bottom:8px; }
  .resource-row .name{ flex:1; font-size:14px; font-weight:500; }
  .resource-del{ background:none; border:1px solid rgba(189,79,46,0.4); color:var(--rust); font-size:12px; font-family:'IBM Plex Mono', monospace; padding:5px 10px; border-radius:var(--radius); cursor:pointer; }
  .resource-del:hover{ background: var(--rust-bg); }
  .danger-zone{ border:1px solid rgba(189,79,46,0.35); border-radius: var(--radius); padding:16px; background: rgba(189,79,46,0.05); }
  .danger-zone p{ font-size:12.5px; color:var(--muted-2); margin: 0 0 12px; line-height:1.5; }
  .btn-danger{ background: var(--rust); color:#fff; }
  .btn-danger:hover{ filter:brightness(1.1); }

  @media (max-width: 480px){
    .sheet{ padding: 26px 18px 24px; }
    .sheet-inner{ padding-left: 14px; }
    .sheet::before{ left: 40px; }
    .hero-num{ font-size: 52px; }
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar" id="topbar" style="display:none;">
    <button class="icon-btn" id="addCourseBtn" title="Add a course">+</button>
    <span class="brand"><b>Study Ledger</b><span class="switch-link" id="switchProfileBtn">switch profile</span></span>
    <div style="display:flex; gap:8px;">
      <button class="icon-btn" id="listCoursesBtn" title="All courses">☰</button>
      <button class="icon-btn" id="settingsBtn" title="Settings">⚙</button>
    </div>
  </div>
  <div class="sheet" id="sheet" style="display:none;"></div>
  <div id="profileScreen"></div>
</div>

<div id="toast" class="toast"></div>

<script>
/* =========================================================
   1) PASTE YOUR SUPABASE CONFIG BELOW
   Get this from: Supabase project -> Settings -> API
   ========================================================= */
const SUPABASE_URL = "https://qosftknilfrgegulggik.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_DwNCqjxwYuM-L9poY7BE_Q_bY1QEFi8";
/* ========================================================= */

(function(){
  const COLORS = ['#bd4f2e','#3f8f5f','#b8862e','#3c6e93','#7a5ea8','#a34b7a'];
  const configured = SUPABASE_URL && SUPABASE_URL !== "YOUR_SUPABASE_URL";
  const AUTO_REFRESH_MS = 15000; // pick up changes made on other devices

  let db = null;
  let profiles = [];
  let currentProfile = null;
  let courses = [];
  let entries = [];

  let view = { name: 'home', courseId: null };

  const sheet = document.getElementById('sheet');
  const topbar = document.getElementById('topbar');
  const profileScreen = document.getElementById('profileScreen');
  const toastEl = document.getElementById('toast');

  function todayStr(){
    const d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function formatDateLabel(dstr){
    const [y,m,d] = dstr.split('-').map(Number);
    const dt = new Date(y, m-1, d);
    const t = new Date(); t.setHours(0,0,0,0);
    const diffDays = Math.round((t - dt) / 86400000);
    if(diffDays === 0) return 'TODAY · ' + dt.toLocaleDateString('en-US',{month:'short', day:'numeric'});
    if(diffDays === 1) return 'YESTERDAY · ' + dt.toLocaleDateString('en-US',{month:'short', day:'numeric'});
    return dt.toLocaleDateString('en-US',{weekday:'short', month:'short', day:'numeric', year:'numeric'}).toUpperCase();
  }
  function formatTime(t){
    if(!t) return '';
    const [h,m] = t.split(':').map(Number);
    const ap = h >= 12 ? 'PM' : 'AM';
    const hh = ((h+11)%12)+1;
    return hh+':'+String(m).padStart(2,'0')+' '+ap;
  }
  function todayHeaderDate(){
    return new Date().toLocaleDateString('en-US',{weekday:'long', month:'long', day:'numeric'});
  }
  function showToast(msg){
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    setTimeout(()=> toastEl.classList.remove('show'), 1800);
  }
  function escapeHtml(s){
    return (s||'').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
  }
  function avatarInner(p){
    if(p && p.avatar) return `<img class="avatar-img" src="${p.avatar}" alt="">`;
    return (p && p.name ? p.name : '?').trim().charAt(0).toUpperCase();
  }

  if(configured){
    db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  }
  let refreshTimer = null;

  async function renderProfileScreen(){
    topbar.style.display = 'none';
    sheet.style.display = 'none';
    profileScreen.style.display = 'block';

    if(!configured){
      profileScreen.innerHTML = `
        <div class="profile-screen">
          <div class="profile-heading">Study Ledger</div>
          <div class="profile-sub">Cloud sync isn't set up yet</div>
          <div class="setup-note">
            This copy isn't connected to a database yet, so profiles can't be saved or synced across devices.<br><br>
            Open <b>index.html</b> in a code/text editor, find the <b>SUPABASE_URL</b> and <b>SUPABASE_ANON_KEY</b> constants near the top of the &lt;script&gt;, and paste in your Supabase project's values. Then re-upload the file to GitHub.
          </div>
        </div>`;
      return;
    }

    profileScreen.innerHTML = `
      <div class="profile-screen">
        <div class="profile-heading">Who's studying?</div>
        <div class="profile-sub">${todayHeaderDate().toUpperCase()}</div>
        <div class="profile-grid" id="profileGrid"><div class="setup-note">Loading profiles…</div></div>
      </div>`;

    const { data, error } = await db.from('profiles').select('*').order('created_at');
    if(error){
      profileScreen.querySelector('.profile-grid').innerHTML =
        `<div class="setup-note">Couldn't reach the database. Double-check your Supabase URL/key and that you ran the setup SQL.<br><br>Error: ${escapeHtml(error.message||String(error))}</div>`;
      return;
    }
    profiles = data || [];

    const grid = document.getElementById('profileGrid');
    grid.innerHTML = profiles.map(p => `
      <div class="profile-tile" onclick="App.selectProfile('${p.id}')">
        <div class="profile-avatar" style="${p.avatar ? '' : 'background:'+p.color}">${avatarInner(p)}</div>
        <div class="profile-tile-name">${escapeHtml(p.name)}</div>
      </div>
    `).join('') + `
      <div class="profile-tile profile-add-tile" onclick="App.openAddProfile()">
        <div class="profile-avatar">+</div>
        <div class="profile-tile-name">Add profile</div>
      </div>`;
  }

  function openAddProfileModal(){
    const overlay = document.createElement('div');
    overlay.className = 'overlay';
    overlay.id = 'modalOverlay';
    overlay.innerHTML = `
      <div class="panel">
        <div class="panel-head">
          <div class="panel-title">New profile</div>
          <button class="panel-close" onclick="App.closeModal()">✕</button>
        </div>
        <label>Name</label>
        <input type="text" id="profileNameInput" placeholder="e.g. Arjun" maxlength="30">
        <label>Color</label>
        <div class="swatches" id="profileColorSwatches"></div>
        <div class="panel-actions">
          <button class="btn btn-ghost" onclick="App.closeModal()">Cancel</button>
          <button class="btn btn-primary" onclick="App.submitAddProfile()">Create profile</button>
        </div>
      </div>`;
    document.body.appendChild(overlay);
    overlay.addEventListener('click', e => { if(e.target === overlay) closeModal(); });
    let selectedColor = COLORS[profiles.length % COLORS.length];
    const sw = document.getElementById('profileColorSwatches');
    COLORS.forEach(col => {
      const d = document.createElement('div');
      d.className = 'swatch' + (col === selectedColor ? ' selected' : '');
      d.style.background = col;
      d.onclick = () => { selectedColor = col; [...sw.children].forEach(c=>c.classList.remove('selected'))
